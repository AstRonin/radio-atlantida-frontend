# Included in the http context of the nginx-unprivileged image (conf.d/default.conf).

map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # Docker's embedded DNS. Resolving the backend per request lets the panel start even when the
  # backend is not up yet; /api then returns 502 until it is.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $backend http://backend:8080;

  # Security headers. Locations below must not use add_header, or these stop being inherited.
  # Angular adds component styles at runtime, hence 'unsafe-inline' for styles only.
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Frame-Options "DENY" always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  # The Live page uses the microphone (design §8.4); nothing else, and no framed page, may.
  add_header Permissions-Policy "microphone=(self), camera=(), geolocation=(), payment=(), usb=()" always;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  location /api/ws {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
  }

  location /api/ {
    proxy_pass $backend;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    # Track preview streams audio with Range requests (design §6.6).
    proxy_buffering off;
    client_max_body_size 50m;
  }

  # Translations and help texts are not content-hashed, so they are revalidated on each load.
  location /assets/ {
    expires -1;
    try_files $uri =404;
  }

  # Build output with content hashes in the file names.
  location ~* \.(?:js|css|woff2?|ico|svg|png)$ {
    expires 1y;
    try_files $uri =404;
  }

  location / {
    expires -1;
    try_files $uri $uri/ /index.html;
  }
}
