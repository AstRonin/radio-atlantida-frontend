name: release

# A tag vX.Y.Z publishes ghcr.io/astronin/radio-atlantida-frontend:X.Y.Z and the GitHub release
# vX.Y.Z (docs/f12-release-plan.md). The deploy repository refers to X.Y.Z only, for both images.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # GHCR needs the owner in lower case.
  IMAGE: ghcr.io/astronin/radio-atlantida-frontend

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Tag is vX.Y.Z
        id: tag
        # The update script accepts only ^\d+\.\d+\.\d+$ as IMAGE_TAG.
        run: |
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::tag $tag is not vX.Y.Z; nothing is released"; exit 1
          fi
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Tagged commit is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME ($GITHUB_SHA) is not on main"; exit 1
          fi
      - name: API snapshot is the backend release of the same version
        # Both images share one IMAGE_TAG, so the panel must ship the contract of that backend.
        env:
          VERSION: ${{ steps.tag.outputs.version }}
        run: |
          got=$(jq -r '.info.version' api/openapi.json)
          if [ "$got" != "$VERSION" ]; then
            echo "::error::api/openapi.json is API version $got, want $VERSION; run npm run api:sync with the backend release asset"
            exit 1
          fi

  ci:
    needs: check
    uses: ./.github/workflows/ci.yml

  image:
    needs: [check, ci]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v5
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
      - name: Image tag is not taken
        # A released tag is never overwritten; a fix gets a new patch version.
        run: |
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION already exists"; exit 1
          fi
      - name: Build
        run: |
          docker build -f docker/Dockerfile -t "$IMAGE:$VERSION" \
            --build-arg VERSION="$VERSION" \
            --build-arg REVISION="$GITHUB_SHA" \
            --build-arg CREATED="$(date -u +%Y-%m-%dT%H:%M:%SZ)" .
      - name: Serve the shell
        run: |
          got=$(docker inspect -f '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$IMAGE:$VERSION")
          if [ "$got" != "$VERSION" ]; then
            echo "::error::image is labelled version $got, want $VERSION"; exit 1
          fi
          docker run -d --name panel -p 8080:8080 "$IMAGE:$VERSION"
          for _ in $(seq 1 20); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then exit 0; fi
            sleep 1
          done
          docker logs panel
          exit 1
      - name: Push
        run: docker push "$IMAGE:$VERSION"

  release:
    needs: [check, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes \
            --title "$GITHUB_REF_NAME" \
            --notes "Image: \`$IMAGE:$VERSION\`. Deploy with the backend of the same version: \`update.bat $VERSION\`."
